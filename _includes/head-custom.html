<!-- Render ```mermaid fences (which Jekyll emits as code blocks) as diagrams,
     matching how github.com renders the same markdown. -->
<script type="module">
  import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";
  document.addEventListener("DOMContentLoaded", async () => {
    for (const code of document.querySelectorAll(".language-mermaid code, code.language-mermaid")) {
      const holder = code.closest("div.highlighter-rouge") || code.closest("pre");
      const pre = document.createElement("pre");
      pre.className = "mermaid";
      pre.textContent = code.textContent;
      holder.replaceWith(pre);
    }
    mermaid.initialize({ startOnLoad: false, theme: "neutral" });
    await mermaid.run();
  });
</script>
<style>
  pre.mermaid { background: transparent; text-align: center; }
</style>
